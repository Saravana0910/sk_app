name: Android Build

permissions:
  contents: read
  actions: write

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a signed release APK/AAB (requires signing secrets)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: mobile/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: yarn install --frozen-lockfile

      - name: Restore Salesforce Mobile SDK cache
        uses: actions/cache@v4
        with:
          path: mobile/mobile_sdk/SalesforceMobileSDK-Android
          key: salesforce-mobile-sdk-android-${{ runner.os }}-${{ hashFiles('mobile/package.json', 'mobile/installandroid.js') }}

      - name: Install Salesforce Mobile SDK for Android
        run: node installandroid.js

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test --ci

      # AGP requires JDK 17 to run the build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # android-actions/setup-android@v3 fails trying to install the legacy 'tools'
      # package, which Google removed; ubuntu-latest already ships a licensed SDK.
      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # The NDK install is deliberately not cached: it's a ~4GB directory, and
      # uploading/downloading that to the Actions cache is slower than sdkmanager
      # just fetching it fresh from Google each run.
      - name: Restore Android SDK components cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-components-${{ runner.os }}-android-36-build-tools-35.0.0

      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: mobile/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: yarn install --frozen-lockfile

      - name: Restore Salesforce Mobile SDK cache
        uses: actions/cache@v4
        with:
          path: mobile/mobile_sdk/SalesforceMobileSDK-Android
          key: salesforce-mobile-sdk-android-${{ runner.os }}-${{ hashFiles('mobile/package.json', 'mobile/installandroid.js') }}

      - name: Install Salesforce Mobile SDK for Android
        run: node installandroid.js

      # AGP requires JDK 17 to run the build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # android-actions/setup-android@v3 fails trying to install the legacy 'tools'
      # package, which Google removed; ubuntu-latest already ships a licensed SDK.
      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # The NDK install is deliberately not cached: it's a ~4GB directory, and
      # uploading/downloading that to the Actions cache is slower than sdkmanager
      # just fetching it fresh from Google each run.
      - name: Restore Android SDK components cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-components-${{ runner.os }}-android-36-build-tools-35.0.0

      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x ./gradlew

      # Keystore is decoded to an ephemeral runner path and never committed to the repo.
      - name: Validate release signing configuration
        working-directory: mobile/android/app
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        working-directory: mobile/android/app
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          keytool -list -keystore release.keystore -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_SK_UPLOAD_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_SK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_SK_VERSION_CODE: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_SK_VERSION_NAME: ${{ github.ref_name }}-${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        working-directory: mobile/android/app
        run: rm -f release.keystore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
